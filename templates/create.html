<!DOCTYPE html>
<html>
<head>
    <title>{{ 'Edit' if film else 'Add' }} Film</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#141414; color:white; }
        .form-box { background:#1f1f1f; padding:30px; border-radius:10px; margin-top: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn-netflix { background:#e50914; color:white; font-weight: bold; }
        .btn-netflix:hover { background:#b20710; color:white; }
        .form-control { background: #333; border: 1px solid #444; color: white; }
        .form-control:focus { background: #444; border-color: #e50914; color: white; box-shadow: none; }
        .form-label { font-weight: bold; color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 form-box">
                <h2 class="text-center mb-4">{{ 'Edit Film' if film else 'Add New Film' }}</h2>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" name="title" value="{{ film.title if film else '' }}" required placeholder="e.g., Interstellar">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" name="category" value="{{ film.category if film else '' }}" required placeholder="e.g., Sci-Fi">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Year</label>
                            <input type="number" class="form-control" name="year" value="{{ film.year if film else '' }}" required min="1888" max="2026" placeholder="e.g., 2014">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rating</label>
                        <input type="number" step="0.1" class="form-control" name="rating" value="{{ film.rating if film else '' }}" required min="0" max="10" placeholder="e.g., 9.0">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Poster URL</label>
                        <input type="url" class="form-control" name="image_url" value="{{ film.image_url if film else '' }}" placeholder="https://example.com/poster.jpg">
                        <div class="form-text text-muted">Paste a direct link to an image.</div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-netflix px-4">{{ 'Save Changes' if film else 'Add Film' }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
